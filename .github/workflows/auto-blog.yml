name: Auto Blog Publisher

on:
  schedule:
    - cron: '30 1 * * *'  # 매일 UTC 01:30 = KST 10:30
  workflow_dispatch:        # 수동 실행 (테스트용)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # state.json 커밋을 위해 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Install script-only dependencies
        run: npm install --no-save ts-node

      - name: Generate and publish blog post
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: npx ts-node --project scripts/tsconfig.json scripts/auto-generate.ts

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/state.json
          git diff --staged --quiet || git commit -m "chore: update blog topic state [skip ci]"
          git push
