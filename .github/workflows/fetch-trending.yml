name: Fetch Trending Videos by Category

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 UTC 15:00 = KST 자정(00:00)
  workflow_dispatch:        # 수동 실행 (테스트용)

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ts-node
        run: npm install --no-save ts-node

      - name: Install ws
        run: npm install ws @types/ws

      - name: Fetch and upsert trending videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx ts-node --project scripts/tsconfig.json scripts/fetch-trending-by-category.ts
